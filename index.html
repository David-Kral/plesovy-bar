<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F5F9">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#F2F5F9}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Plesový bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling column (max 760px), fixed bottom tab bar, bottom sheets for editing.
   Numbers set in the display face, ticket-style dashed rules, drink colours as the only decoration. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EEF4; --ink:#10161F; --muted:#566173; --line:#DAE1EA;
  --accent:#0B72B5; --accent-ink:#FFFFFF; --accent-soft:#DAEDF9;
  --good:#17784B; --good-soft:#DAF2E5; --warn:#8F5A05; --warn-soft:#FAEACB; --bad:#B8312B; --bad-soft:#FADFDD; --bad-ink:#FFFFFF;
  --c1:#0B72B5; --c2:#D9822B; --c3:#7B61D6; --c4:#4F8486;
  --shadow:0 -6px 30px rgba(16,22,31,.14);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#161C25; --surface-2:#1F2733; --ink:#EAEFF6; --muted:#98A3B5; --line:#263040;
    --accent:#5CC8FF; --accent-ink:#062433; --accent-soft:#12303F;
    --good:#4ADE9A; --good-soft:#12342A; --warn:#F5C45E; --warn-soft:#38300F; --bad:#FF7A72; --bad-soft:#3C1C1A; --bad-ink:#2A0907;
    --c1:#5CC8FF; --c2:#F0A55A; --c3:#A894F5; --c4:#8FB8BA;
    --shadow:0 -6px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161C25; --surface-2:#1F2733; --ink:#EAEFF6; --muted:#98A3B5; --line:#263040;
  --accent:#5CC8FF; --accent-ink:#062433; --accent-soft:#12303F;
  --good:#4ADE9A; --good-soft:#12342A; --warn:#F5C45E; --warn-soft:#38300F; --bad:#FF7A72; --bad-soft:#3C1C1A; --bad-ink:#2A0907;
  --c1:#5CC8FF; --c2:#F0A55A; --c3:#A894F5; --c4:#8FB8BA;
  --shadow:0 -6px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
small{font-size:12.5px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab-num{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.pos{color:var(--good)}

/* top bar + shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--font-display);letter-spacing:-.02em}
.brand svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.cloud i{background:var(--good)}
.chip.saving i{background:var(--warn)}
.chip.error i,.chip.readonly i{background:var(--bad)}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-h h1{font-size:30px;font-weight:700;line-height:1.05}
.sub{color:var(--muted);margin-top:5px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h h2{font-size:18px;font-weight:650}
.lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px}

/* buttons, fields */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.armed{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.btn.block{width:100%}
.in{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;min-width:0}
textarea.in{padding:10px 12px;min-height:90px;line-height:1.4}
.in:focus{border-color:var(--accent);outline:none}
select.in{padding-right:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;min-width:0}
.item:first-child{border-top:0}
button.item:hover{background:var(--surface-2)}
.grow{flex:1;min-width:0}
.grow>b,.grow>.t{display:block;font-weight:600;overflow-wrap:anywhere}
.r{text-align:right;flex:none}
.r b{display:block;font-variant-numeric:tabular-nums}
.date{flex:none;width:44px;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0}
.date b{display:block;font:700 18px/1 var(--font-display)}
.date span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.group-h{padding:8px 14px;background:var(--surface-2);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:24px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note span{flex:1;min-width:200px}

/* hero numbers */
.hero{display:flex;flex-direction:column;gap:16px}
.hero-num{font:700 clamp(40px,13vw,64px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line);padding-top:12px}
.stats.s4{grid-template-columns:repeat(2,1fr);row-gap:14px}
.stat{min-width:0}
.stat+.stat{padding-left:14px;border-left:1px dashed var(--line)}
.stats.s4 .stat:nth-child(3){padding-left:0;border-left:0}
.stat b{display:block;font:650 20px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:3px}
.inv{display:flex;flex-direction:column;gap:8px}
.inv-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.track{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track>span{display:block;height:100%;border-radius:99px;transition:width .25s}

/* charts */
.chart{width:100%;height:auto;display:block;max-width:540px;margin:0 auto}
.chart .bar{fill:var(--c1)}
.chart .bar.neg{fill:var(--bad)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--ink);font:600 10px var(--font-body)}
.chart .lbl.dim{fill:var(--muted);font-weight:500}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack span{display:block;height:100%;min-width:0;transition:width .25s}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}
.legend{display:grid;gap:9px}
.lg{display:flex;align-items:center;gap:9px}
.lg i{width:11px;height:11px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;gap:8px}
.bar-top b{font-weight:600}
.bar-top .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

/* event detail */
.crumb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-10px}
.sale{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sale:first-child{border-top:0}
.sale-top{display:flex;align-items:center;gap:10px}
.sale-sum{font-size:13px;color:var(--muted);padding-left:21px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.stepper button{width:38px;height:42px;border:0;background:var(--surface-2);font-size:19px;line-height:1}
.stepper input{width:56px;text-align:center;border:0;min-height:42px;background:transparent;font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.srow{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 40px;gap:8px}
.srow:first-child{border-top:0}
.srow .sub2{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow .sub2 label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.srow .sub2 .in{width:78px;min-height:38px}
.srow .sub2 b{margin-left:auto;font-variant-numeric:tabular-nums}
.crow{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 112px 40px;gap:8px;align-items:center}
.crow:first-child{border-top:0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-weight:600}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pg{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.pg span{display:flex;align-items:center;gap:7px}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl th:not(:first-child),.tbl td:not(:first-child){text-align:right}
.tbl tfoot td{font-weight:700;border-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,18,.55)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:640px;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.sheet-head h2{font-size:20px}
.sheet-body{overflow:auto;padding:10px 18px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{border-color:var(--surface);box-shadow:0 0 0 3px var(--accent)}
.irow{display:grid;grid-template-columns:1fr 40px;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.irow:first-child{border-top:0}
.irow .amt{grid-column:1/2;display:flex;align-items:center;gap:8px}
.irow .amt .in{width:96px}
.irow .amt .u{color:var(--muted);font-size:13px;min-width:22px}
.irow .cst{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.prev{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:var(--surface-2);border-radius:12px;padding:14px}
.prev b{display:block;font:650 18px/1.2 var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.map-row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.map-row:first-child{border-top:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);background:none;border:0}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.note.warn{background:var(--warn-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in:disabled{opacity:.7;background:var(--surface-2)}
button.item:disabled{opacity:.6}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 16px var(--font-display);flex:none}
.check.sm{font-size:13px;color:var(--muted);align-items:center;gap:6px}
.check.sm input{width:18px;height:18px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l-8 9z"/><path d="M12 13v7M8 20h8"/></svg>Plesový bar</div>
  <button class="chip" id="syncChip" data-act="sync-info" type="button"><i></i><span>Lokálně</span></button>
</div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Hlavní navigace"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn ghost sm" type="button" data-act="close-sheet" aria-label="Zavřít">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
var nf0=new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:1});
var nf2=new Intl.NumberFormat('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2});
var NB=' ';
function kc(n,d){n=Number(n)||0;if(d!==2&&Math.abs(n)<0.5)n=0;return (d===2?nf2:nf0).format(n)+NB+'Kč'}
function pc(n){return nf0.format(n)+NB+'%'}
function fk(v){var a=Math.abs(v);var s=a>=1000?nf1.format(a/1000)+'k':nf0.format(a);return (v<0?'−':'')+s}
function plural(n,one,few,many){return n===1?one:(n>=2&&n<=4?few:many)}
function parseNum(v){
  if(typeof v==='number')return v;
  var s=String(v==null?'':v).trim().replace(/[\s ]/g,'').replace(/[^\d,.\-+]/g,'');
  if(!s)return NaN;
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){ if(lc>ld)s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(lc>-1){ s=s.replace(',','.'); }
  else if(ld>-1&&(s.match(/\./g)||[]).length>1){ s=s.replace(/\./g,''); }
  var n=parseFloat(s);return isFinite(n)?n:NaN;
}
function num(el){var n=parseNum(el.value);return isFinite(n)?n:0}
function numStr(n){return (n===0||n==null||!isFinite(n))?'':String(Math.round(n*1000)/1000).replace('.',',')}
function round2(n){return Math.round(n*100)/100}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseD(s){return new Date(s+'T12:00:00')}
function fdate(s){return s?parseD(s).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'}):''}
function fshort(s){return parseD(s).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})}
function daysUntil(s){return Math.round((parseD(s)-parseD(todayStr()))/86400000)}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}

/* ================= state ================= */
var LS_KEY='plesovy-bar-v1', LS_VIEW='plesovy-bar-view';
var DRINK_COLORS=['#E8772E','#58A55C','#8A5A3C','#8FC7D4','#F2C14E','#B6D36B','#D6567A','#7B61D6'];
var DEFAULT_SETTINGS={feePct:1.5,reservePct:10,defaultRate:150,targetPct:30,investment:12000,importMap:{}};

function emptyState(){return {v:1,settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),ingredients:[],drinks:[],events:[],team:[]}}

function seed(){
  function ing(id,name,cat,unit,pack,price){return {id:id,name:name,cat:cat,unit:unit,pack:pack,price:price}}
  var ingredients=[

function calc(e){

    var unitCost=(s&&s.unitCost!=null)?s.unitCost:drinkCost(d,m);
    var cost=qty*unitCost;
    rows.push({d:d,qty:qty,revenue:revenue,unitCost:unitCost,cost:cost,profit:revenue-cost});
    rev+=revenue;ing+=cost;units+=qty;
  });
  var other=e.otherRevenue||0;rev+=other;
  var staff=e.staff.reduce(function(s,x){return s+(x.hours||0)*(x.rate||0)},0);
  var costs=e.costs.reduce(function(s,x){return s+(x.amount||0)},0);
  var fee=rev*state.settings.feePct/100;
  var cost=ing+staff+costs+fee,profit=rev-cost;
  return {rows:rows,rev:rev,ing:ing,staff:staff,other:costs,fee:fee,cost:cost,profit:profit,margin:rev>0?profit/rev*100:0,units:units,otherRev:other};
}
function played(){return state.events.filter(function(e){return calc(e).rev>0}).sort(function(a,b){return a.date<b.date?-1:1})}
function totals(){
  var T={events:played(),rev:0,ing:0,staff:0,other:0,fee:0,cost:0,profit:0,units:0,drinks:{}};
  T.events.forEach(function(e){
    var c=calc(e);T.rev+=c.rev;T.ing+=c.ing;T.staff+=c.staff;T.other+=c.other;T.fee+=c.fee;T.cost+=c.cost;T.profit+=c.profit;T.units+=c.units;
    c.rows.forEach(function(r){if(!r.qty)return;var t=T.drinks[r.d.id]||(T.drinks[r.d.id]={d:r.d,qty:0,rev:0,cost:0});t.qty+=r.qty;t.rev+=r.revenue;t.cost+=r.cost});
  });
  T.margin=T.rev>0?T.profit/T.rev*100:0;
  return T;
}
function planNeeds(e){
  var m=ingMap(),need={},res=state.settings.reservePct/100;
  state.drinks.forEach(function(d){var q=e.plan[d.id]||0;if(!q)return;d.items.forEach(function(it){need[it.ing]=(need[it.ing]||0)+(it.amt||0)*q})});
  var rows=[],total=0;
  Object.keys(need).forEach(function(id){
    var i=m[id];if(!i)return;
    var n=need[id]*(1+res),have=Math.max(0,i.stock||0),short=Math.max(0,n-have),packs=i.pack>0?Math.ceil(short/i.pack-1e-9):0,cost=packs*i.price;total+=cost;
    rows.push({i:i,need:n,have:have,packs:packs,cost:cost});
  });
  var order={'Alkohol':0,'Mix':1,'Ostatní':2};
  rows.sort(function(a,b){return (order[a.i.cat]||0)-(order[b.i.cat]||0)||a.i.name.localeCompare(b.i.name,'cs')});
  return {rows:rows,total:total};
}
function consumption(e){
  var out={};
  state.drinks.forEach(function(d){var s=e.sales[d.id];if(!s||!s.qty)return;d.items.forEach(function(it){out[it.ing]=(out[it.ing]||0)+(it.amt||0)*s.qty})});
  return out;
}
function staffUnpaid(e){return e.staff.reduce(function(s,x){return s+(x.paid?0:(x.hours||0)*(x.rate||0))},0)}
function memberRows(m){
  var out=[];
  state.events.forEach(function(e){e.staff.forEach(function(s){if(s.memberId===m.id||(!s.memberId&&s.name&&norm(s.name)===norm(m.name)))out.push({e:e,s:s})})});
  return out;
}
function memberStats(m){
  var rs=memberRows(m),h=0,pay=0,unpaid=0;
  rs.forEach(function(r){var p=(r.s.hours||0)*(r.s.rate||0);h+=r.s.hours||0;pay+=p;if(!r.s.paid)unpaid+=p});
  return {rows:rs,hours:h,pay:pay,unpaid:unpaid};
}
function allStaffTotals(){
  var h=0,pay=0,unpaid=0;
  state.events.forEach(function(e){e.staff.forEach(function(s){var p=(s.hours||0)*(s.rate||0);h+=s.hours||0;pay+=p;if(!s.paid)unpaid+=p})});
  return {hours:h,pay:pay,unpaid:unpaid};
}
function stockState(i){
  var s=i.stock||0;
  if(s<0)return {cls:'bad',t:'Chybí'};
  if(s===0)return {cls:'bad',t:'Došlo'};
  if(i.min>0&&s<=i.min)return {cls:'warn',t:'Nízký stav'};
  return null;
}
function stockText(i){return nf1.format(Math.round((i.stock||0)*10)/10)+NB+esc(i.unit)}
function restockList(){
  var rows=[],total=0;
  state.ingredients.forEach(function(i){
    if(!(i.min>0)||(i.stock||0)>i.min||!(i.pack>0))return;
    var packs=Math.max(1,Math.ceil((i.min-(i.stock||0))/i.pack-1e-9)),cost=packs*i.price;total+=cost;rows.push({i:i,packs:packs,cost:cost});
  });
  return {rows:rows,total:total};
}
function stockValue(){var v=0;state.ingredients.forEach(function(i){v+=Math.max(0,i.stock||0)*unitPrice(i)});return v}
function historyShares(exceptId){
  var tot={},sum=0;
  state.events.forEach(function(e){if(e.id===exceptId)return;Object.keys(e.sales).forEach(function(id){var q=e.sales[id].qty||0;tot[id]=(tot[id]||0)+q;sum+=q})});
  var act=state.drinks.filter(function(d){return d.active}),sh={};
  if(sum>0){act.forEach(function(d){sh[d.id]=(tot[d.id]||0)/sum})}
  else{act.forEach(function(d){sh[d.id]=1/(act.length||1)})}
  return sh;
}

function stackBar(parts,live){
  var tot=parts.reduce(function(s,p){return s+Math.max(0,p.v)},0)||1;
  var bar='<div class="stack" role="img" aria-label="Struktura nákladů">'+parts.map(function(p,i){return '<span class="s'+(i+1)+'" '+(live?'data-w="'+p.k+'" ':'')+'style="width:'+(Math.max(0,p.v)/tot*100).toFixed(1)+'%"></span>'}).join('')+'</div>';
  var lg='<div class="legend">'+parts.map(function(p,i){return '<div class="lg"><i class="s'+(i+1)+'"></i><span>'+esc(p.l)+'</span><b '+(live?'data-live="b-'+p.k+'"':'')+'>'+kc(p.v)+'</b></div>'}).join('')+'</div>';
  return bar+lg;
}
function barChart(data){
  var W=360,H=200,pt=24,pb=36,pl=6,pr=6;
  var vals=data.map(function(d){return d.v});
  var max=Math.max.apply(null,vals.concat([0])),min=Math.min.apply(null,vals.concat([0])),range=(max-min)||1;
  function y(v){return pt+(max-v)/range*(H-pt-pb)}
  var y0=y(0),step=(W-pl-pr)/data.length,bw=Math.min(40,step*0.62);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Zisk podle akcí" class="chart"><line class="axis" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'"/>';
  data.forEach(function(d,i){
    var x=pl+step*i+(step-bw)/2,yy=y(d.v),top=Math.min(yy,y0),h=Math.max(1,Math.abs(yy-y0)),cx=(x+bw/2).toFixed(1);
    s+='<rect class="bar'+(d.v<0?' neg':'')+'" x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4"/>';
    s+='<text class="lbl" x="'+cx+'" y="'+(d.v>=0?top-5:top+h+12).toFixed(1)+'" text-anchor="middle">'+fk(d.v)+'</text>';
    s+='<text class="lbl dim" x="'+cx+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(d.l)+'</text>';
  });
  return s+'</svg>';
}

  function set(k,t,n){$$('[data-live="'+k+'"]').forEach(function(el){el.textContent=t;if(el.hasAttribute('data-signed'))el.classList.toggle('neg',n<0)})}

  set('st-total',kc(c.staff));set('st-unpaid',kc(staffUnpaid(e)));set('co-total',kc(c.other));set('units',nf0.format(c.units));

/* ================= import (SumUp CSV) ================= */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'';
  var delim=[';',',','\t'].map(function(d){return [d,first.split(d).length-1]}).sort(function(a,b){return b[1]-a[1]})[0][0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c==='\r'){}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
function hasWord(h,k){return k.length<=3?h.split(' ').indexOf(k)>-1:h.indexOf(k)>-1}
function guessCol(header,keys){
  var hn=header.map(norm);
  for(var k=0;k<keys.length;k++)for(var i=0;i<hn.length;i++)if(hn[i]&&hasWord(hn[i],keys[k]))return i;
  return -1;
}
function startImport(rows,name){
  var header=rows[0].map(function(x){return String(x).trim()});
  imp={name:name||'',header:header,rows:rows.slice(1),amode:'line',map:{},mode:'replace',addUn:true,
    cols:{
      item:guessCol(header,['popis','description','polozka','item','nazev','produkt','product','name','zbozi']),
      qty:guessCol(header,['mnozstvi','pocet','quantity','qty','ks']),
      amount:guessCol(header,['celkem','total','castka','amount','gross','brutto','cena','price']),
      status:guessCol(header,['stav','status'])
    }};
}
function aggregate(){
  var out={},skipped=0,I=imp;
  I.rows.forEach(function(r){
    if(I.cols.status>-1&&/refund|vrac|storn|fail|neuspes|zamit|declin|cancel/.test(norm(r[I.cols.status]))){skipped++;return}
    var qty=I.cols.qty>-1?parseNum(r[I.cols.qty]):1;if(!isFinite(qty)||qty<=0)qty=1;
    var amt=I.cols.amount>-1?parseNum(r[I.cols.amount]):0;if(!isFinite(amt))amt=0;
    if(I.amode==='unit')amt*=qty;
    var name=I.cols.item>-1?String(r[I.cols.item]||'').trim():'';
    var key=norm(name)||'(bez nazvu)';
    var o=out[key]||(out[key]={key:key,name:name||'(bez názvu)',qty:0,amount:0});
    o.qty+=qty;o.amount+=amt;
  });
  return {items:Object.keys(out).map(function(k){return out[k]}).sort(function(a,b){return b.amount-a.amount}),skipped:skipped};
}
function defaultMap(key){
  var saved=state.settings.importMap[key];
  if(saved&&state.drinks.some(function(d){return d.id===saved}))return saved;
  var best='';
  state.drinks.forEach(function(d){var dn=norm(d.name);if(dn&&key&&(key.indexOf(dn)>-1||dn.indexOf(key)>-1)&&!best)best=d.id});
  return best;
}
function importBody(){

  var h='<p class="hint">Soubor: <b>'+esc(I.name||'vložený text')+'</b> · '+I.rows.length+' '+plural(I.rows.length,'řádek','řádky','řádků')+'. <button class="btn ghost sm" type="button" data-act="imp-reset">Změnit</button></p>';

  A.items.forEach(function(it){

  });
  if(!A.items.length)h+='<p class="hint">V souboru jsem nenašel žádné řádky. Zkontroluj výběr sloupců.</p>';
  h+='</div></div>';

  return h;
}
function importFoot(){
  if(!imp)return '';
  if(!imp.header)return btn('Zrušit','close-sheet')+btn('Zpracovat vložený text','imp-parse','primary');
  return btn('Zrušit','close-sheet')+btn('Použít u akce','imp-apply','primary');
}
function applyImport(){
  var e=curEvent();if(!e||!imp)return;
  var A=aggregate(),agg={},un=0;
  A.items.forEach(function(it){
    var did=imp.map[it.key];
    if(did){var a=agg[did]||(agg[did]={qty:0,revenue:0});a.qty+=it.qty;a.revenue+=it.amount;state.settings.importMap[it.key]=did}
    else un+=it.amount;
  });
  var m=ingMap(),old=e.sales;
  if(imp.mode==='replace')e.sales={};
  Object.keys(agg).forEach(function(did){
    var d=state.drinks.find(function(x){return x.id===did});if(!d)return;
    var s=e.sales[did]||(e.sales[did]={qty:0,revenue:0,unitCost:(old[did]&&old[did].unitCost!=null&&imp.mode==='add')?old[did].unitCost:drinkCost(d,m)});
    s.qty=Math.round((s.qty+agg[did].qty)*100)/100;s.revenue=round2(s.revenue+agg[did].revenue);
  });
  if(imp.addUn&&un>0)e.otherRevenue=round2((imp.mode==='add'?(e.otherRevenue||0):0)+un);
  else if(imp.mode==='replace'&&!imp.addUn)e.otherRevenue=e.otherRevenue||0;
  touch();closeSheet();render();toast('Import hotový');
}
function readFileText(file){
  return file.arrayBuffer().then(function(buf){
    try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}
    catch(e){try{return new TextDecoder('windows-1250').decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
  });
}

function csvCell(v){var s=String(v==null?'':v);return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvNum(n){return String(round2(n)).replace('.',',')}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n')}
function eventCSV(e){
  var c=calc(e),r=[['Akce',e.name],['Datum',fdate(e.date)],['Místo',e.place],[],['Drink','Počet','Tržba (Kč)','Náklad na kus (Kč)','Hrubý zisk (Kč)']];
  c.rows.forEach(function(x){r.push([x.d.name,x.qty,csvNum(x.revenue),csvNum(x.unitCost),csvNum(x.profit)])});
  if(c.otherRev)r.push(['Ostatní tržba','',csvNum(c.otherRev)]);
  r.push([],['Zaměstnanec','Hodin','Sazba (Kč/h)','Mzda (Kč)']);
  e.staff.forEach(function(s){r.push([s.name,csvNum(s.hours||0),csvNum(s.rate||0),csvNum((s.hours||0)*(s.rate||0))])});
  r.push([],['Náklad','Částka (Kč)']);
  e.costs.forEach(function(x){r.push([x.label,csvNum(x.amount||0)])});
  r.push(['Poplatek terminálu',csvNum(c.fee)],[],['Tržba',csvNum(c.rev)],['Náklady celkem',csvNum(c.cost)],['Čistý zisk',csvNum(c.profit)],['Marže (%)',csvNum(c.margin)]);
  return toCSV(r);
}
function allCSV(){
  var act=state.drinks.filter(function(d){return d.active});
  var r=[['Datum','Akce','Místo','Tržba','Suroviny','Mzdy','Nájem a ostatní','Poplatek terminálu','Čistý zisk','Marže (%)','Drinků celkem'].concat(act.map(function(d){return d.name+' (ks)'}))];
  state.events.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(e){
    var c=calc(e);
    r.push([fdate(e.date),e.name,e.place,csvNum(c.rev),csvNum(c.ing),csvNum(c.staff),csvNum(c.other),csvNum(c.fee),csvNum(c.profit),csvNum(c.margin),c.units].concat(act.map(function(d){return (e.sales[d.id]&&e.sales[d.id].qty)||0})));
  });
  return toCSV(r);
}
function exportFile(filename,text){
  var p=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads'):Promise.resolve(null);

    if(dl){
      return dl.save({filename:filename,data:text}).then(function(){toast('Soubor je připravený')}).catch(function(err){
        if(err&&err.code==='declined')return;
        fallbackExport(filename,text);
      });

  });

    case 'dup-event':if(e){
      var cp={id:uid(),name:e.name+' (kopie)',date:todayStr(),place:e.place||'',note:'',staff:e.staff.map(function(s){return Object.assign({},s,{id:uid(),paid:false})}),costs:e.costs.map(function(s){return Object.assign({},s,{id:uid()})}),sales:{},otherRevenue:0,plan:Object.assign({},e.plan),planTotal:e.planTotal};
      state.events.push(cp);touch();go('events',cp.id);toast('Akce zduplikována, uprav datum');}break;
    case 'export-event':if(e)exportFile('akce-'+slug(e.name)+'-'+e.date+'.csv',eventCSV(e));break;
    case 'export-all':exportFile('plesovy-bar-akce-'+todayStr()+'.csv',allCSV());break;
    case 'export-json':exportFile('plesovy-bar-zaloha-'+todayStr()+'.json',JSON.stringify(state,null,1));break;
    case 'restore':openSheet({type:'restore',text:''});break;
    case 'restore-apply':{
      try{var o=JSON.parse(sheet.text||'');if(!o||!Array.isArray(o.events)||!Array.isArray(o.drinks))throw new Error('x');state=normalize(o);touch();closeSheet();render(true);toast('Záloha obnovena')}
      catch(err){toast('Tohle není platná záloha')}
      break}
    case 'step':{
      var inp=t.parentElement.querySelector('input'),v=Math.max(0,(parseNum(inp.value)||0)+(+t.dataset.dir));
      inp.value=v?String(v):'';inp.dispatchEvent(new Event('input',{bubbles:true}));break}
    case 'add-staff':if(e){e.staff.push({id:uid(),name:'',memberId:'',hours:6,rate:state.settings.defaultRate,paid:false});touch();render()}break;
    case 'del-staff':if(e){e.staff=e.staff.filter(function(s){return s.id!==id});touch();render()}break;
    case 'add-cost':if(e){e.costs.push({id:uid(),label:'',amount:0});touch();render()}break;
    case 'del-cost':if(e){e.costs=e.costs.filter(function(s){return s.id!==id});touch();render()}break;
    case 'recalc-costs':if(e){var m=ingMap();Object.keys(e.sales).forEach(function(k){var dd=state.drinks.find(function(z){return z.id===k});if(dd)e.sales[k].unitCost=drinkCost(dd,m)});touch();render();toast('Náklady přepočítány')}break;
    case 'plan-split':if(e){
      var total=Math.round(e.planTotal||0);if(!total){toast('Nejdřív zadej očekávaný počet drinků');break}
      var sh=historyShares(e.id);e.plan={};Object.keys(sh).forEach(function(k){var q=Math.round(total*sh[k]);if(q)e.plan[k]=q});touch();render();toast('Rozděleno podle historie')}break;
    case 'open-import':if(e){imp={name:'',header:null,rows:[],cols:{},map:{},mode:'replace',addUn:true,amode:'line'};openSheet({type:'import'})}break;
    case 'imp-reset':imp={name:'',header:null,rows:[],cols:{},map:{},mode:'replace',addUn:true,amode:'line'};renderSheet(true);break;
    case 'imp-parse':{
      var ta=$('#impText');var txt=ta?ta.value:'';var rows=parseCSV(txt);
      if(rows.length<2){var er=$('#impErr');if(er)er.textContent='Vložený text vypadá prázdně nebo bez řádků s daty.';break}
      startImport(rows,'');renderSheet(true);break}
    case 'imp-apply':applyImport();break;
    case 'del-demo':state.events=state.events.filter(function(z){return !z.demo});touch();render();toast('Ukázkové akce smazány');break;
    case 'wipe-all':state=emptyState();touch();go('dash');toast('Všechna data smazána');break;
    case 'goto-sklad':go('ings');break;
    case 'goto-team':go('team');break;
    case 'new-member':openSheet({type:'member',draft:{id:'',name:'',phone:'',rate:state.settings.defaultRate,note:''}});break;
    case 'edit-member':{var mm=state.team.find(function(z){return z.id===id});if(mm)openSheet({type:'member',draft:Object.assign({},mm)});break}
    case 'save-member':{
      var mb2=sheet.draft;if(!mb2.name.trim()){toast('Doplň jméno');break}
      var mdata={name:mb2.name.trim(),phone:(mb2.phone||'').trim(),rate:mb2.rate||0,note:(mb2.note||'').trim()};
      if(mb2.id){
        var o4=state.team.find(function(z){return z.id===mb2.id});Object.assign(o4,mdata);
        state.events.forEach(function(z){z.staff.forEach(function(s){if(s.memberId===o4.id)s.name=o4.name})});
      }else state.team.push(Object.assign({id:uid()},mdata));
      touch();closeSheet();render();break}
    case 'del-member':{
      var mid=sheet.draft.id;
      state.events.forEach(function(z){z.staff.forEach(function(s){if(s.memberId===mid)s.memberId=''})});
      state.team=state.team.filter(function(z){return z.id!==mid});touch();closeSheet();render();toast('Člen týmu smazán');break}
    case 'member-paid-all':{
      var md=sheet.draft;memberRows({id:md.id,name:md.name}).forEach(function(r){r.s.paid=true});
      touch();renderSheet();render();toast('Označeno jako vyplacené');break}
    case 'apply-stock':if(e){
      var c2=consumption(e),k2=Object.keys(c2);
      if(!k2.length){toast('Nejdřív zadej prodeje');break}
      var m3=ingMap(),ap={};
      k2.forEach(function(k){var g=m3[k];if(!g)return;var u=Math.round(c2[k]*100)/100;ap[k]=u;g.stock=Math.round(((g.stock||0)-u)*100)/100});
      e.stockApplied=ap;touch();render();toast('Spotřeba odečtena ze skladu')}break;
    case 'undo-stock':if(e&&e.stockApplied){
      var m4=ingMap();
      Object.keys(e.stockApplied).forEach(function(k){var g=m4[k];if(g)g.stock=Math.round(((g.stock||0)+e.stockApplied[k])*100)/100});
      delete e.stockApplied;touch();render();toast('Odečet vrácen')}break;
    case 'i-restock':{
      var np=sheet.addPacks||0;
      if(!(np>0)||!(sheet.draft.pack>0)){toast('Zadej počet balení');break}
      sheet.draft.stock=round2((sheet.draft.stock||0)+np*sheet.draft.pack);sheet.addPacks=0;renderSheet();toast('Přidáno, nezapomeň uložit');break}
    case 'export-stock':{
      var sr=[['Surovina','Skupina','Skladem','Jednotka','Minimum','Balení','Cena balení (Kč)','Hodnota skladu (Kč)']];
      state.ingredients.forEach(function(i){sr.push([i.name,i.cat,csvNum(i.stock||0),i.unit,csvNum(i.min||0),csvNum(i.pack),csvNum(i.price),csvNum(Math.max(0,i.stock||0)*unitPrice(i))])});
      exportFile('sklad-'+todayStr()+'.csv',toCSV(sr));break}
    case 'export-team':{
      var tr=[['Jméno','Sazba (Kč/h)','Hodin','Mzdy (Kč)','Nevyplaceno (Kč)']];
      state.team.forEach(function(m){var st=memberStats(m);tr.push([m.name,csvNum(m.rate||0),csvNum(st.hours),csvNum(st.pay),csvNum(st.unpaid)])});
      exportFile('tym-'+todayStr()+'.csv',toCSV(tr));break}
    case 'new-drink':openSheet({type:'drink',draft:{id:'',name:'',price:0,color:DRINK_COLORS[state.drinks.length%DRINK_COLORS.length],items:[{ing:'',amt:0}]}});break;
    case 'edit-drink':{var dd=state.drinks.find(function(z){return z.id===id});if(dd)openSheet({type:'drink',draft:JSON.parse(JSON.stringify(dd))});break}
    case 'd-color':sheet.draft.color=t.dataset.c;renderSheet();break;
    case 'd-add-row':sheet.draft.items.push({ing:'',amt:0});renderSheet();break;
    case 'd-del-row':sheet.draft.items.splice(+t.dataset.i,1);renderSheet();break;
    case 'save-drink':{
      var dr=sheet.draft;if(!dr.name.trim()){toast('Doplň název drinku');break}
      var items=dr.items.filter(function(it){return it.ing&&it.amt>0});
      if(dr.id){var o2=state.drinks.find(function(z){return z.id===dr.id});o2.name=dr.name.trim();o2.price=dr.price||0;o2.color=dr.color;o2.items=items}
      else state.drinks.push({id:uid(),name:dr.name.trim(),price:dr.price||0,color:dr.color,active:true,items:items});
      touch();closeSheet();render();break}
    case 'del-drink':{
      var did=sheet.draft.id,dx=state.drinks.find(function(z){return z.id===did});
      var inUse=state.events.some(function(z){return z.sales[did]});
      if(inUse){dx.active=!dx.active;toast(dx.active?'Drink obnoven':'Drink je v historii akcí, přesunul jsem ho do archivu')}
      else{state.drinks=state.drinks.filter(function(z){return z.id!==did});toast('Drink smazán')}
      touch();closeSheet();render();break}
    case 'new-ing':openSheet({type:'ing',draft:{id:'',name:'',cat:'Alkohol',unit:'ml',pack:700,price:0,stock:0,min:0},addPacks:0});break;
    case 'edit-ing':{var ii=state.ingredients.find(function(z){return z.id===id});if(ii)openSheet({type:'ing',draft:Object.assign({},ii)});break}
    case 'save-ing':{
      var ig=sheet.draft;if(!ig.name.trim()){toast('Doplň název suroviny');break}
      if(!(ig.pack>0)){toast('Velikost balení musí být větší než 0');break}
      if(ig.id){var o3=state.ingredients.find(function(z){return z.id===ig.id});Object.assign(o3,{name:ig.name.trim(),cat:ig.cat,unit:ig.unit,pack:ig.pack,price:ig.price||0,stock:ig.stock||0,min:ig.min||0})}
      else state.ingredients.push({id:uid(),name:ig.name.trim(),cat:ig.cat,unit:ig.unit,pack:ig.pack,price:ig.price||0,stock:ig.stock||0,min:ig.min||0});
      touch();closeSheet();render();break}
    case 'del-ing':{
      var gid=sheet.draft.id,using=state.drinks.filter(function(z){return z.items.some(function(it){return it.ing===gid})});
      if(using.length){toast('Používá se v: '+using.map(function(z){return z.name}).join(', '));break}
      state.ingredients=state.ingredients.filter(function(z){return z.id!==gid});touch();closeSheet();render();toast('Surovina smazána');break}
    case 'copy-text':{
      var ta2=$('#infoText');
      var done=function(){toast('Zkopírováno')};
      var fb=function(){ta2.focus();ta2.select();toast('Označeno, zkopíruj ručně')};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta2.value).then(done).catch(fb)}else fb();
      break}
  }
}

function isTextual(el){return (el.tagName==='INPUT'&&['checkbox','radio','file'].indexOf(el.type)<0&&el.type!=='date')||el.tagName==='TEXTAREA'}
function onInput(ev){
  var el=ev.target;
  if(ev.type==='change'&&isTextual(el))return;
  if(ev.type==='input'&&!isTextual(el)&&el.type!=='date')return;
  if(el.closest('#sheet'))return sheetInput(el);
  var f=el.dataset.f;if(!f)return;
  if(f.indexOf('set:')===0){
    var k=f.slice(4);state.settings[k]=Math.max(0,num(el));touch();return;
  }
  var e=curEvent();if(!e)return;
  var id=el.dataset.id,x;
  switch(f){
    case 'qty':{
      var dd=state.drinks.find(function(z){return z.id===el.dataset.d});if(!dd)return;
      var n=Math.max(0,Math.round(num(el))),s=e.sales[dd.id]||{qty:0,revenue:0};
      var avg=s.qty>0?s.revenue/s.qty:dd.price;
      if(!n){delete e.sales[dd.id]}
      else{e.sales[dd.id]={qty:n,revenue:round2(n*avg),unitCost:s.unitCost!=null?s.unitCost:drinkCost(dd)}}
      break}
    case 'other-rev':e.otherRevenue=Math.max(0,num(el));break;
    case 'staff-name':{
      x=e.staff.find(function(z){return z.id===id});if(!x)break;
      x.name=el.value;
      var mem=el.value.trim()?state.team.find(function(t){return norm(t.name)===norm(el.value)}):null;
      if(mem){x.memberId=mem.id;x.rate=mem.rate;var ri=$('[data-f="staff-rate"][data-id="'+id+'"]');if(ri)ri.value=numStr(mem.rate)}else x.memberId='';
      break}
    case 'staff-paid':x=e.staff.find(function(z){return z.id===id});if(x)x.paid=el.checked;break;
    case 'staff-hours':x=e.staff.find(function(z){return z.id===id});if(x)x.hours=Math.max(0,num(el));break;
    case 'staff-rate':x=e.staff.find(function(z){return z.id===id});if(x)x.rate=Math.max(0,num(el));break;
    case 'cost-label':x=e.costs.find(function(z){return z.id===id});if(x)x.label=el.value;break;
    case 'cost-amount':x=e.costs.find(function(z){return z.id===id});if(x)x.amount=Math.max(0,num(el));break;
    case 'plan-total':e.planTotal=Math.max(0,Math.round(num(el)));break;
    case 'plan-qty':{var q=Math.max(0,Math.round(num(el)));if(q)e.plan[el.dataset.d]=q;else delete e.plan[el.dataset.d];break}
    default:return;
  }
  touch();liveUpdate();
  if(f==='plan-qty'||f==='plan-total')refreshPlan();
  if(f==='qty')refreshCons();
}
function sheetInput(el){
  if(!sheet)return;
  if(el.id==='impFile'){
    var file=el.files&&el.files[0];if(!file)return;
    readFileText(file).then(function(txt){
      var rows=parseCSV(txt);
      if(rows.length<2){var er=$('#impErr');if(er)er.textContent='V souboru nejsou žádné řádky s daty.';return}
      startImport(rows,file.name);renderSheet(true);
    }).catch(function(){var er=$('#impErr');if(er)er.textContent='Soubor se nepodařilo přečíst.'});
    return;
  }
  if(el.id==='restFile'){
    var f2=el.files&&el.files[0];if(!f2)return;
    readFileText(f2).then(function(txt){sheet.text=txt;renderSheet()}).catch(function(){toast('Soubor se nepodařilo přečíst')});
    return;
  }
  var f=el.dataset.sf;if(!f)return;
  var d=sheet.draft;
  if(sheet.type==='drink'){
    if(f==='name')d.name=el.value;
    else if(f==='price')d.price=num(el);
    else if(f==='row-ing'){var i=+el.dataset.i;d.items[i].ing=el.value;var u=$('#du'+i);if(u)u.textContent=unitOf(el.value);var c=$('#dc'+i);if(c)c.textContent=kc(rowCost(d.items[i]),2)}
    else if(f==='row-amt'){var j=+el.dataset.i;d.items[j].amt=num(el);var c2=$('#dc'+j);if(c2)c2.textContent=kc(rowCost(d.items[j]),2)}
    var pv=$('#dPrev');if(pv)pv.innerHTML=drinkPrevHtml(d);
  }else if(sheet.type==='ing'){
    if(f==='i-name')d.name=el.value;else if(f==='i-cat')d.cat=el.value;else if(f==='i-unit')d.unit=el.value;
    else if(f==='i-pack')d.pack=num(el);else if(f==='i-price')d.price=num(el);
    else if(f==='i-stock'){var sv=parseNum(el.value);d.stock=isFinite(sv)?sv:0}
    else if(f==='i-min')d.min=num(el);
    else if(f==='i-addpacks')sheet.addPacks=num(el);
    var ip=$('#iPrev');if(ip)ip.innerHTML='<div><b style="font-size:16px">'+esc(ingPrevText(d))+'</b></div>';
  }else if(sheet.type==='member'){
    if(f==='m-name')d.name=el.value;else if(f==='m-rate')d.rate=num(el);else if(f==='m-phone')d.phone=el.value;else if(f==='m-note')d.note=el.value;
  }else if(sheet.type==='event'){
    if(f==='e-name')d.name=el.value;else if(f==='e-date')d.date=el.value;else if(f==='e-place')d.place=el.value;else if(f==='e-note')d.note=el.value;
  }else if(sheet.type==='restore'){
    if(f==='rest-text')sheet.text=el.value;
  }else if(sheet.type==='import'&&imp&&imp.header){
    if(f==='imp-col'){imp.cols[el.dataset.k]=parseInt(el.value,10);if(el.dataset.k==='item')imp.map={}}
    else if(f==='imp-amode')imp.amode=el.value;
    else if(f==='imp-map')imp.map[el.dataset.key]=el.value;
    else if(f==='imp-un')imp.addUn=el.checked;
    else if(f==='imp-mode')imp.mode=el.value;
    renderSheet();
  }
}

/* ================= init ================= */
state=loadLocal();
var firstRun=false;
if(!state){state=seed();firstRun=true}
loadView();
if(view.eventId&&!state.events.some(function(e){return e.id===view.eventId}))view.eventId=null;
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&sheet)closeSheet()});
setSync('local');
render(true);
initDb();
})();
</script>
